  # Next.js Frontend (Free Plan)
  - type: web
    name: four-plastic-frontend
    plan: free
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://four-plastic-backend.onrender.com
