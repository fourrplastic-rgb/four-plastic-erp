services:
  # Python Flask Backend (Free Plan)
  - type: web
    name: four-plastic-backend
    plan: free
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: PORT
        value: 5001
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: SUPABASE_URL
        value: https://mhnbjptyuwkuxgvisyle.supabase.co
